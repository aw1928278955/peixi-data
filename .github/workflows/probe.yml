name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://www.wantgoo.com/stock/etf/00878/dividend-policy/ex-dividend" \
            "https://tw.stock.yahoo.com/quote/00878.TW/dividend" \
            "https://tw.finance.yahoo.com/quote/00878.TW/dividend" \
            "https://www.twse.com.tw/zh/ETFortune/etfInfo/00878" \
            "https://www.twse.com.tw/rwd/zh/exRight/TWT48U?response=json" \
            "https://www.twse.com.tw/rwd/zh/exRight/TWT49U?response=json" \
            "https://goodinfo.tw/tw/StockDividendPolicy.asp?STOCK_ID=00878" \
            "https://www.cathaysite.com.tw/ETF/detail/EEA?tab=etf5" \
            "https://www.capitalfund.com.tw/etf/product/detail/195/interest" \
            "https://www.moneydj.com/etf/x/basic/basic0005.xdjhtm?etfid=00878.tw" ; do
            c=$(curl -s -m 25 -o /tmp/o -w "%{http_code} %{size_download}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36" "$u"); echo "PROBE $c $u"; done
