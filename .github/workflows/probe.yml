name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -s -m 25 -A "$UA" "https://stockanalysis.com/etf/voo/dividend/" -o /tmp/s.html
          python3 - <<'PY'
          import re
          t=open('/tmp/s.html',encoding='utf-8',errors='replace').read()
          i=t.find('2026-09-28'); 
          for m in list(re.finditer(r'Sep 28, 2026|2026-09-28',t))[:3]:
              print('PROBE', repr(t[max(0,m.start()-500):m.end()+500]))
          for m in list(re.finditer(r'Ex-Dividend Date',t))[:2]:
              print('PROBE EX', repr(t[m.start()-100:m.start()+500]))
          PY
          curl -s -m 25 -A "$UA" "https://api.nasdaq.com/api/quote/QQQM/dividends?assetclass=etf" | python3 -c "import sys,json; d=json.load(sys.stdin); print('PROBE Q', d['data']['dividends']['rows'][:2])"
