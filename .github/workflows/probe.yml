name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124 Safari/537.36" "https://tw.stock.yahoo.com/quote/00878.TW/dividend" -o /tmp/y.html || true
          python3 - <<'PY'
          import re
          t=open('/tmp/y.html',encoding='utf-8',errors='replace').read()
          for m in list(re.finditer(r'"exDividend":\{', t))[:1]:
              print('PROBE A', t[max(0,m.start()-1500):m.start()])
              print('PROBE B', t[m.start():m.start()+1200])
          k=t.find('"cashDividend"')
          print('PROBE C', t[k-200:k+700])
          print('PROBE len', len(t), 'has1.25', '1.25' in t)
          PY
